name: Release

# Tag convention: v<versionCode> (e.g. v4) - not versionName, which has messy suffixes like
# "-milestone2". versionCode is already the plain monotonic Int AGP requires, so it's the only
# value worth teaching the in-app update checker (AppUpdateRepository) to parse. Human-readable
# versionName ends up in the Release's own title instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Catches the classic "forgot to bump versionCode before tagging" mistake early - without
      # this, the tag and the installed app would report the same versionCode forever, and the
      # in-app update checker (which compares BuildConfig.VERSION_CODE against the tag) would
      # never detect this release at all.
      - name: Verify tag matches versionCode
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION_CODE" ]; then
            echo "Tag $GITHUB_REF_NAME (versionCode $TAG_VERSION) does not match versionCode=$GRADLE_VERSION_CODE in app/build.gradle.kts"
            exit 1
          fi
          echo "GRADLE_VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.GRADLE_VERSION_NAME }} (${{ github.ref_name }})"
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
